version: 2
models:
  - name: fact_kunjungan_pariwisata
    columns:
      - name: jumlah_wisman
        tests:
          - not_null
      - name: avg_suhu
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 15
              max_value: 45
      - name: tpk
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: total_curah_hujan
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: id_provinsi
        tests:
          - relationships:
              to: ref('dim_provinsi')
              field: id_provinsi
  - name: dim_provinsi
    columns:
      - name: id_provinsi
        tests:
          - unique
          - not_null
